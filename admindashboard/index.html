<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GBI — Administration</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      :root {
        --purple:        #7C3AED;
        --purple-hover:  #6D28D9;
        --purple-mid:    #8B5CF6;
        --purple-light:  #A78BFA;
        --purple-pale:   #EDE9FE;
        --purple-bg:     #F5F3FF;
        --sidebar-bg:    #1E1B4B;
        --sidebar-2:     #2D2A6E;
        --page-bg:       #F0EEFF;
        --card-bg:       #FFFFFF;
        --border:        #E8E4FD;
        --border2:       #D4CCFA;
        --text:          #1E1B4B;
        --text2:         #6B7280;
        --text3:         #9CA3AF;
        --green:         #10B981;
        --green-bg:      #D1FAE5;
        --red:           #EF4444;
        --red-bg:        #FEE2E2;
        --amber:         #F59E0B;
        --amber-bg:      #FEF3C7;
        --blue:          #3B82F6;
        --blue-bg:       #DBEAFE;
        --font:          'Inter', sans-serif;
        --r:             12px;
        --r-lg:          18px;
        --r-xl:          22px;
        --shadow:        0 1px 4px rgba(124,58,237,0.07), 0 1px 2px rgba(0,0,0,0.03);
        --shadow-md:     0 4px 20px rgba(124,58,237,0.11);
        --shadow-lg:     0 8px 32px rgba(124,58,237,0.14);
      }
      html, body { height: 100%; background: var(--page-bg); color: var(--text); font-family: var(--font); -webkit-font-smoothing: antialiased; }
      #root { height: 100%; }
      a { text-decoration: none; color: inherit; }
      button { font-family: var(--font); cursor: pointer; border: none; background: none; }
      input, select, textarea { font-family: var(--font); }
      ::-webkit-scrollbar { width: 5px; height: 5px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 4px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
